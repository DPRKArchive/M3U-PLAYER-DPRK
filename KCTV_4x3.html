<style>
    body {
        margin: 0;
        padding: 20px;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .player {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
    }

    video {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: #000;
    }

    #status {
        margin: 12px 0;
        color: #ccc;
        overflow-wrap: anywhere;
    }
</style>
</head>
<body>
<div class="player">
<h2>Korean Central Television - 4:3 Version</h2>
    <p>The current time in the DPRK is: <span id="pyongyang-time">10:03:52 pm</span></p>

    <script>
        function updateTime() {
            const options = {
                timeZone: 'Asia/Pyongyang',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const formatter = new Intl.DateTimeFormat('en-GB', options);
            document.getElementById('pyongyang-time').textContent = formatter.format(new Date());
        }

        // Update immediately and then every second
        updateTime();
        setInterval(updateTime, 1000);
    </script>


    <iframe src="https://player.twitch.tv/?channel=zoltascentral&amp;parent=dprkarchive.github.io&amp;muted=false" height="480" width="640" allowfullscreen="Y">
</iframe>
